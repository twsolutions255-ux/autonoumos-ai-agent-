name: Atlas tests

on:
  push:
    branches: ["**"]
    paths: ["atlas/**", ".github/workflows/atlas-tests.yml"]
  pull_request:
    paths: ["atlas/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests
        # No network and no database: the suite runs the real runtime, policy,
        # memory and HTTP client against an in-process fake of the TWS app.
        run: python -m pytest tests/ -q

      - name: Lint
        run: |
          pip install pyflakes
          # The tool modules are imported for their registration side effect,
          # which pyflakes cannot see. Everything else must be clean.
          python -m pyflakes atlas/ scripts/ \
            | grep -v "tools\.\(clientcare\|comms\|growth\|money\|observe\|reflect\)" \
            | (! grep .)

  endpoints:
    # Atlas calling a path that 404s does not crash — it records a failed tool
    # call, reasons around it, and quietly stops being able to do that thing.
    # Nobody notices for weeks. This job is what makes that impossible to merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the app Atlas drives
        uses: actions/checkout@v4
        with:
          repository: twsolutions255-ux/tws-app
          path: tws-app
          token: ${{ secrets.TWS_APP_READ_TOKEN }}
        continue-on-error: true
        id: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify every endpoint Atlas calls still exists
        if: steps.app.outcome == 'success'
        run: python atlas/scripts/verify_endpoints.py --server tws-app/backend/server.py

      - name: Say why this was skipped
        if: steps.app.outcome != 'success'
        run: |
          echo "::warning::Could not read tws-app, so the endpoint check did not run."
          echo "Add a TWS_APP_READ_TOKEN secret with read access to twsolutions255-ux/tws-app."
